<html lang="ru">
  <head>
    <meta charset="utf-8" />

      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <link rel="canonical" href="https://weisez.github.io/Horizon-Unknown/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Horizon Unknown" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:title" content="Horizon Unknown — Canon Hub" />
    <meta property="og:description" content="Интерактивный справочник по вселенной Horizon Unknown: граф связей, досье персонажей, организации, истории и хронология." />
    <meta property="og:url" content="https://weisez.github.io/Horizon-Unknown/" />
    <meta property="og:image" content="https://weisez.github.io/Horizon-Unknown/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Horizon Unknown — Canon Hub: граф связей, досье, истории" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Horizon Unknown — Canon Hub" />
    <meta name="twitter:description" content="Интерактивный справочник по вселенной Horizon Unknown: граф связей, досье персонажей, организации, истории и хронология." />
    <meta name="twitter:image" content="https://weisez.github.io/Horizon-Unknown/og.png" />
    <link
      rel="icon"
      type="image/svg+xml" href="./favicon.svg"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;600&family=Playfair+Display:ital,wght@0,600;1,400&family=Lora:ital,wght@0,400;0,600;1,400;1,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="bg"></div>
    <div id="stage">
      <div id="world">
        <svg id="lk" width="1" height="1"></svg>
        <div id="nodes"></div>
      </div>
    </div>
    <div id="bar">
      <div id="logo">
        <svg viewBox="0 0 40 40" aria-hidden="true">
          <path
            d="M2 12V2h10M28 2h10v10M38 28v10H28M12 38H2V28"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
          />
          <circle
            cx="20"
            cy="20"
            r="10"
            fill="none"
            stroke="currentColor"
            stroke-width="1.4"
          />
          <path
            d="M20 5v10M20 25v10M5 20h10M25 20h10"
            stroke="currentColor"
            stroke-width="1.4"
          />
          <circle class="sun" cx="20" cy="20" r="2.4" />
        </svg>
        <div><b>HORIZON</b><i>unknown</i></div>
      </div>
      <div id="tabs">
        <i id="tabind"></i><button data-tab="home" class="on">Главная</button
        ><button data-tab="graph">Граф</button
        ><button data-tab="char">Персонажи</button
        ><button data-tab="org">Организации</button
        ><button data-tab="story">Истории</button
        ><button data-tab="time">Таймлайн</button>
      </div>
      <div id="newwrap">
        <button id="b-new">+ Создать</button>
        <div id="newmenu">
          <button data-add="char">Персонаж</button
          ><button data-add="org">Организация</button
          ><button data-add="story">История</button>
        </div>
      </div>
      <button id="b-flt">Фильтры</button><span class="sp"></span>
      <button id="b-lay">Разложить</button><button id="b-fit">Вместить</button
      ><button id="b-zo">−</button><button id="b-zi">+</button>
      <button id="b-theme">Тема</button><button id="b-data">Данные</button>
    </div>
    <div id="home">
      <div id="hwrap"><div id="hcanvas"></div></div>
    </div>
    <div id="hbar">
      <button class="pri" id="h-build">Конструктор</button
      ><span class="hadd"
        ><button data-hadd="title">+ Заголовок</button
        ><button data-hadd="text">+ Текст</button
        ><button data-hadd="image">+ Картинка</button
        ><button data-hadd="quote">+ Цитата</button
        ><button data-hadd="stat">+ Цифра</button
        ><button data-hadd="button">+ Кнопка</button></span
      >
    </div>
    <div id="tl"><div id="tltrack"></div></div>
    <div id="tbar">
      <button data-tls="-1">◀</button
      ><button class="pri" id="t-add">+ Событие</button
      ><button data-tls="1">▶</button>
    </div>
    <div id="fpop">
      <input id="f-q" placeholder="Поиск по имени, описанию, цитатам…" />
      <div class="chips" id="f-t">
        <button data-ft="char">Персонажи</button
        ><button data-ft="org">Организации</button
        ><button data-ft="story">Истории</button>
      </div>
      <label>Связан с<select id="f-rel"></select></label>
      <div class="chips" id="f-k"></div>
      <div class="act" style="margin: 0">
        <button id="f-reset">Сбросить</button>
      </div>
    </div>
    <div id="list"></div>
    <div id="legend">
      <span style="--c: var(--c-char)">Персонажи</span
      ><span style="--c: var(--c-org)">Организации</span
      ><span style="--c: var(--c-story)">Истории</span>
    </div>
    <div class="ov" id="ov"><div class="panel" id="panel"></div></div>
    <script defer src="js/01-core.js"></script>
    <script defer src="js/02-graph-view.js"></script>
    <script defer src="js/03-panel.js"></script>
    <script defer src="js/04-toolbar-lists-bg.js"></script>
    <script defer src="js/05-home-builder.js"></script>
    <script defer src="js/06-kinds-timeline-structures.js"></script>
    <script defer src="js/07-relations-window.js"></script>
    <script defer src="js/08-delete.js"></script>
    <script defer src="js/09-org-structure.js"></script>
    <script defer src="js/10-graph-hud.js"></script>
    <script defer src="js/11-live-background.js"></script>
    <script defer src="js/12-story-editor.js"></script>
    <script defer src="js/13-corrupted.js"></script>
    <script defer src="js/14-media-library.js"></script>
    <script defer src="js/15-lists-order-dividers.js"></script>
    <script defer src="js/16-timeline-slideshow.js"></script>
    <script defer src="js/17-publish.js"></script>
    <script defer src="js/99-init.js"></script>
  </body>
</html>
