    <script>
      let OWN = false;
      try {
        OWN = localStorage.getItem("hu-owner") === "1";
      } catch (e) {}
      if (
        !OWN &&
        location.hash.startsWith("#edit=") &&
        window.crypto &&
        crypto.subtle
      ) {
        crypto.subtle
          .digest(
            "SHA-256",
            new TextEncoder().encode(
              decodeURIComponent(location.hash.slice(6)),
            ),
          )
          .then((b) => {
            const x = [...new Uint8Array(b)]
              .map((v) => v.toString(16).padStart(2, "0"))
              .join("");
            if (
              x ===
              "b717c2c85e674314fdc4a1ee9e5ec1d63dbb3a457d00487c873db291462ed24b"
            ) {
              try {
                localStorage.setItem("hu-owner", "1");
              } catch (e) {}
            }
            location.replace(location.pathname + location.search);
          });
      }
      const VIEW =
        location.search.includes("view") ||
        (/\.github\.io$/.test(location.hostname) && !OWN);
      if (VIEW) document.documentElement.classList.add("view");
      const KEY = "hu-hub-v1",
        $ = (s) => document.querySelector(s),
        T = { char: "Персонаж", org: "Организация", story: "История" };
      const uid = () => Math.random().toString(36).slice(2, 9);
      const esc = (s) =>
        String(s == null ? "" : s).replace(
          /[&<>"]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
        );
      const ini = (s) =>
        (s || "?")
          .trim()
          .split(/\s+/)
          .slice(0, 2)
          .map((w) => w[0])
          .join("")
          .toUpperCase();
      let S,
        cur = null,
        view = { x: 0, y: 0, k: 1 },
        saveT;
      const byId = (id) => S.nodes.find((n) => n.id === id);

      function seed() {
        const N = (id, type, name, sub, short, long = "", quote = "") => ({
          id,
          type,
          name,
          sub,
          short,
          long,
          quote,
          img: "",
          x: Math.cos(id.length * 7 + name.length) * 300 + Math.random() * 200,
          y: Math.sin(name.length * 3) * 300 + Math.random() * 200,
        });
        const nodes = [
          N(
            "niko",
            "char",
            "Niko Weisez",
            "Vol. 1",
            "Бывший хирург-травматолог, ставший спецоператором. Хранит карты close to chest.",
            "Former trauma surgeon, turned special operator, haunted by a ghost he once saved. Hunted by the shadows of San Fierro.",
            "neither here nor there",
          ),
          N(
            "ezik",
            "char",
            "Ezikiel Yang Stewart",
            "Vol. 2",
            "Федеральный оперативник со спокойствием, которое не доходит до рук.",
            "Joined the Office because the benefits were good — but stayed because he discovered he was good at the work.",
            "I wasn’t sent to help. I was sent to clean up.",
          ),
          N(
            "lis",
            "char",
            "Елисей Антропов",
            "Лис · Грех · Фокс",
            "Статус неизвестен. Есть непроверенная информация.",
            "",
            "В России говорят, что вор должен сидеть в тюрьме. В Америке — что вор должен платить. Я и там, и там не вписался.",
          ),
          N(
            "nath",
            "char",
            "Nathaniel Johannsson",
            "FSK Jaegers",
            "Последний из троих на обложке Vol. 5.",
            "",
            "",
          ),
          N(
            "gold",
            "char",
            "Agent Gold",
            "Kontrol Group PMC",
            "Улыбается так, будто всё уже решено.",
            "",
            "",
          ),
          N(
            "escal",
            "char",
            "Escal Delacroix",
            "The Art of Lie",
            "Герой Vol. 6.",
            "",
            "Some lies save lives. Others end them.",
          ),
          N(
            "sey",
            "char",
            "Seymour Abernathy",
            "The Art of Lie",
            "Герой Vol. 6, постарше и пострашнее.",
            "",
            "",
          ),
          N(
            "fsk",
            "org",
            "FSK Jaegers",
            "Спецподразделение",
            "Разведывательно-диверсионная группа. Hazlim Nazari и Dar Koval вычеркнуты.",
            "",
            "",
          ),
          N(
            "kg",
            "org",
            "Kontrol Group",
            "PMC",
            "Частная военная компания.",
            "",
            "",
          ),
          N(
            "office",
            "org",
            "The Office",
            "Федеральная служба",
            "Организация, куда пришёл Ezikiel.",
            "",
            "",
          ),
          N(
            "v1",
            "story",
            "Vol. 1 · Horizon",
            "Season 1",
            "История Niko Weisez.",
            "",
            "",
          ),
          N(
            "v2",
            "story",
            "Vol. 2 · Horizon",
            "Season 1",
            "История Ezikiel Yang Stewart.",
            "",
            "",
          ),
          N(
            "v3",
            "story",
            "Vol. 3 · Неверный",
            "Season 1",
            "История Елисея Антропова.",
            "",
            "",
          ),
          N(
            "v5",
            "story",
            "Vol. 5 · Neither Here Nor There",
            "Season 1",
            "FSK Jaegers.",
            "",
            "",
          ),
          N(
            "v6",
            "story",
            "Vol. 6 · The Art of Lie",
            "Season 1",
            "Escal Delacroix и Seymour Abernathy.",
            "",
            "",
          ),
          N(
            "v7",
            "story",
            "Vol. 7 · De-classified",
            "Season 1",
            "Agent Gold, Kontrol Group PMC.",
            "",
            "",
          ),
        ];
        const L = (a, b, label) => ({ id: uid(), a, b, label });
        return {
          nodes,
          links: [
            L("niko", "v1", "главный герой"),
            L("ezik", "v2", "главный герой"),
            L("lis", "v3", "главный герой"),
            L("nath", "v5", "главный герой"),
            L("fsk", "v5", "отряд"),
            L("nath", "fsk", "служит"),
            L("escal", "v6", "герой"),
            L("sey", "v6", "герой"),
            L("escal", "sey", "противостояние"),
            L("gold", "v7", "герой"),
            L("gold", "kg", "работает на"),
            L("kg", "v7", "тема"),
            L("ezik", "office", "агент"),
            L("office", "v2", "тема"),
          ],
        };
      }
      function load() {
        if (VIEW) {
          S = { nodes: [], links: [], home: { blocks: [] }, events: [] };
          return false;
        }
        try {
          const r = localStorage.getItem(KEY);
          if (r) {
            S = JSON.parse(r);
            return false;
          }
        } catch (e) {}
        S = seed();
        return true;
      }
      function save() {
        if (VIEW) return;
        clearTimeout(saveT);
        saveT = setTimeout(() => {
          try {
            localStorage.setItem(KEY, JSON.stringify(S));
          } catch (e) {}
        }, 250);
      }

      function render() {
        $("#nodes").innerHTML = S.nodes
          .map(
            (n, i) =>
              `<div class="node ${n.type}" data-id="${n.id}" style="animation-delay:${i * 45}ms" data-new="${SEEN.has(n.id) ? 0 : 1}"><div class="ph">${n.img ? `<img src="${n.img}" alt="">` : `<span>${esc(ini(n.name))}</span>`}</div><div class="tx"><b>${esc(n.name)}</b><i>${esc(n.sub)}</i><p>${esc(n.short)}</p></div>${stp(n)}</div>`,
          )
          .join("");
        pos();
      }
      function pos() {
        document.querySelectorAll(".node").forEach((e) => {
          const n = byId(e.dataset.id);
          if (n) {
            e.style.left = n.x + "px";
            e.style.top = n.y + "px";
          }
        });
        drawLinks();
      }
      function drawLinks() {
        const m = new Map(S.nodes.map((n) => [n.id, n]));
        let h = "";
        S.links.forEach((l) => {
          const a = m.get(l.a),
            b = m.get(l.b);
          if (!a || !b) return;
          const dx = b.x - a.x,
            dy = b.y - a.y,
            cx = (a.x + b.x) / 2 - dy * 0.12,
            cy = (a.y + b.y) / 2 + dx * 0.12,
            mx = (a.x + b.x) / 4 + cx / 2,
            my = (a.y + b.y) / 4 + cy / 2;
          h += `<g class="lnk${lf(l, a, b)}" style="${lk(l)}" data-a="${l.a}" data-b="${l.b}"><path d="M${a.x} ${a.y}Q${cx} ${cy} ${b.x} ${b.y}"/>${l.label ? `<text x="${mx}" y="${my}">${esc(l.label)}</text>` : ""}</g>`;
        });
        $("#lk").innerHTML = h;
      }
      function focusNode(id) {
        const w = $("#world");
        w.classList.toggle("focus", !!id);
        const rel = new Set([id]);
        S.links.forEach((l) => {
          if (l.a === id) rel.add(l.b);
          if (l.b === id) rel.add(l.a);
        });
        document
          .querySelectorAll(".node")
          .forEach((e) =>
            e.classList.toggle("on", !!id && rel.has(e.dataset.id)),
          );
        document
          .querySelectorAll(".lnk")
          .forEach((e) =>
            e.classList.toggle(
              "on",
              !!id && (e.dataset.a === id || e.dataset.b === id),
            ),
          );
      }
      $("#nodes").addEventListener("pointerover", (e) => {
        const n = e.target.closest(".node");
        if (n && !drag) focusNode(n.dataset.id);
      });
      $("#nodes").addEventListener("pointerout", (e) => {
        if (!drag && e.target.closest(".node")) focusNode(null);
      });

      /* view */
      function applyView() {
        $("#world").style.transform =
          `translate(${view.x}px,${view.y}px) scale(${view.k})`;
        const st = $("#stage").style;
        st.backgroundPosition = `${view.x}px ${view.y}px`;
        st.backgroundSize = `${32 * view.k}px ${32 * view.k}px`;
        $("#bg").style.transform =
          `translate(${view.x * 0.02}px,${view.y * 0.02}px)`;
      }
      function fit() {
        if (!S.nodes.length) return;
        const xs = S.nodes.map((n) => n.x),
          ys = S.nodes.map((n) => n.y),
          W = innerWidth,
          H = innerHeight;
        const x0 = Math.min(...xs) - 150,
          x1 = Math.max(...xs) + 150,
          y0 = Math.min(...ys) - 200,
          y1 = Math.max(...ys) + 200;
        view.k = Math.min(W / (x1 - x0), H / (y1 - y0), 1.1);
        view.x = W / 2 - ((x0 + x1) / 2) * view.k;
        view.y = H / 2 - ((y0 + y1) / 2) * view.k;
        const w = $("#world");
        w.style.transition = "transform .6s cubic-bezier(.3,.8,.3,1)";
        applyView();
        setTimeout(() => (w.style.transition = ""), 650);
      }
      function zoomAt(f, cx, cy) {
        const k = Math.max(0.2, Math.min(2.5, view.k * f)),
          r = k / view.k;
        view.x = cx - (cx - view.x) * r;
        view.y = cy - (cy - view.y) * r;
        view.k = k;
        applyView();
      }
      $("#stage").addEventListener(
        "wheel",
        (e) => {
          e.preventDefault();
          zoomAt(e.deltaY < 0 ? 1.1 : 0.91, e.clientX, e.clientY);
        },
        { passive: false },
      );
      $("#b-zi").onclick = () => zoomAt(1.25, innerWidth / 2, innerHeight / 2);
      $("#b-zo").onclick = () => zoomAt(0.8, innerWidth / 2, innerHeight / 2);
      $("#b-fit").onclick = fit;

      /* drag + click */
      let drag = null;
      const stage = $("#stage");
      function endDrag(commit) {
        if (!drag) return;
        const d = drag;
        drag = null;
        try {
          stage.releasePointerCapture(d.pid);
        } catch (x) {}
        document.body.classList.remove("dragging-node");
        if (d.el) d.el.classList.remove("dragging");
        if (d.n) {
          if (d.moved >= d.th) save();
          else if (commit) show(d.n.id, d.el);
        }
        if (!(d.el && d.el.matches(":hover"))) focusNode(null);
      }
      stage.addEventListener("dragstart", (e) => e.preventDefault());
      stage.addEventListener("pointerdown", (e) => {
        if (e.pointerType === "mouse" && e.button !== 0) return;
        if (drag) endDrag(false);
        const el = e.target.closest(".node"),
          n = el && byId(el.dataset.id);
        drag = {
          n,
          el,
          pid: e.pointerId,
          th: e.pointerType === "touch" ? 9 : 5,
          sx: e.clientX,
          sy: e.clientY,
          vx: view.x,
          vy: view.y,
          ox: n && n.x,
          oy: n && n.y,
          moved: 0,
          on: 0,
        };
        if (n) e.preventDefault();
        stage.setPointerCapture(e.pointerId);
      });
      stage.addEventListener("pointermove", (e) => {
        if (!drag || e.pointerId !== drag.pid) return;
        if (e.pointerType === "mouse" && e.buttons === 0) {
          endDrag(false);
          return;
        }
        const d = drag,
          dx = e.clientX - d.sx,
          dy = e.clientY - d.sy;
        d.moved = Math.max(d.moved, Math.hypot(dx, dy));
        if (d.n) {
          if (d.moved < d.th) return;
          if (!d.on) {
            d.on = 1;
            d.el.classList.add("dragging");
            document.body.classList.add("dragging-node");
          }
          d.n.x = d.ox + dx / view.k;
          d.n.y = d.oy + dy / view.k;
          d.el.style.left = d.n.x + "px";
          d.el.style.top = d.n.y + "px";
          drawLinks();
          focusNode(d.n.id);
        } else {
          view.x = d.vx + dx;
          view.y = d.vy + dy;
          applyView();
        }
      });
      stage.addEventListener("pointerup", (e) => {
        if (drag && e.pointerId === drag.pid) endDrag(true);
      });
      stage.addEventListener("pointercancel", () => endDrag(false));
      stage.addEventListener("lostpointercapture", () => endDrag(false));
      addEventListener("blur", () => endDrag(false));

      /* layout */
      function layout(anim) {
        const N = S.nodes,
          P = N.map((n) => ({ x: n.x, y: n.y })),
          idx = new Map(N.map((n, i) => [n.id, i]));
        for (let it = 0; it < 400; it++) {
          const F = N.map(() => [0, 0]);
          for (let i = 0; i < N.length; i++)
            for (let j = i + 1; j < N.length; j++) {
              let dx = P[i].x - P[j].x,
                dy = P[i].y - P[j].y,
                d2 = dx * dx + dy * dy + 0.01,
                d = Math.sqrt(d2),
                f = 140000 / d2;
              F[i][0] += (dx / d) * f;
              F[i][1] += (dy / d) * f;
              F[j][0] -= (dx / d) * f;
              F[j][1] -= (dy / d) * f;
            }
          S.links.forEach((l) => {
            const i = idx.get(l.a),
              j = idx.get(l.b);
            if (i == null || j == null) return;
            const dx = P[j].x - P[i].x,
              dy = P[j].y - P[i].y,
              d = Math.hypot(dx, dy) || 1,
              f = (d - 270) * 0.02;
            F[i][0] += (dx / d) * f;
            F[i][1] += (dy / d) * f;
            F[j][0] -= (dx / d) * f;
            F[j][1] -= (dy / d) * f;
          });
          N.forEach((n, i) => {
            P[i].x += (F[i][0] - P[i].x * 0.01) * 0.6;
            P[i].y += (F[i][1] - P[i].y * 0.01) * 0.6;
          });
        }
        if (!anim) {
          N.forEach((n, i) => {
            n.x = P[i].x;
            n.y = P[i].y;
          });
          return;
        }
        const from = N.map((n) => ({ x: n.x, y: n.y })),
          t0 = performance.now();
        (function step(t) {
          const p = Math.min(1, (t - t0) / 800),
            e = 1 - Math.pow(1 - p, 3);
          N.forEach((n, i) => {
            n.x = from[i].x + (P[i].x - from[i].x) * e;
            n.y = from[i].y + (P[i].y - from[i].y) * e;
          });
          pos();
          if (p < 1) requestAnimationFrame(step);
          else {
            save();
            fit();
          }
        })(t0);
      }
      $("#b-lay").onclick = () => layout(true);

  <div class="act"><button class="pri" data-done>Готово</button><button data-stamps>Штампы</button><button data-del>Удалить</button></div></div>`;
      }
      $("#panel").addEventListener("input", (e) => {

            const k = Math.min(1, 520 / Math.max(im.width, im.height)),

            c.height = im.height * k;

            edit(cur);
          };

        };

      });
      $("#panel").addEventListener("click", (e) => {

        `<div id="ss"><div class="ss-in"><div class="ss-bar"><i></i></div><div class="ss-top"><span class="ss-d"></span><span class="ss-n"></span></div><h3 class="ss-t"></h3><div class="ss-x"></div><div class="ss-ch"></div><div class="ss-ctl"><button data-ss="prev" title="Назад (←)">◀</button><button data-ss="play" class="pri" title="Пауза / продолжить (Пробел)">❚❚</button><button data-ss="next" title="Дальше (→)">▶</button><button data-ss="sp" title="Скорость">1×</button><button data-ss="fs" title="Во весь экран (F)">⛶</button><span class="sp"></span><button data-ss="x" title="Выйти (Esc)">Выйти</button></div></div></div>`,
      );
      $("#t-add").insertAdjacentHTML(
        "beforebegin",
        `<button class="pri" id="t-show" title="Автоматически показать события по порядку">▶ Рассказать</button>`,
      );
      const SS = {
          on: 0,
          i: 0,
          play: 0,
          sp: 1,
          evs: [],
          tm: 0,
          t0: 0,
          rem: 0,
          dur: 0,
          end: 0,
          fs: 0,
        },
        SPD = [1, 1.5, 2, 0.75];
      const ssBar = () => $("#ss .ss-bar i"),
        ssBtn = () => {
          $('[data-ss="play"]').textContent = SS.play
            ? "❚❚"
            : SS.end
              ? "↻"
              : "▶";
        };
      const ssDur = (e) =>
        Math.min(13000, 3200 + (e.text || "").length * 55) / SS.sp;
      function ssRun() {
        const b = ssBar();
        clearTimeout(SS.tm);
        b.style.transition = "none";
        b.style.width = 100 * (1 - SS.rem / SS.dur) + "%";
        void b.offsetWidth;
        b.style.transition = `width ${SS.rem}ms linear`;
        b.style.width = "100%";
        SS.t0 = performance.now();
        SS.tm = setTimeout(() => {
          SS.i < SS.evs.length - 1 ? ssGo(SS.i + 1) : ssEnd();
        }, SS.rem);
      }
      function ssPause() {
        clearTimeout(SS.tm);
        SS.rem = Math.max(0, SS.rem - (performance.now() - SS.t0));
        const b = ssBar(),
          w = getComputedStyle(b).width;
        b.style.transition = "none";
        b.style.width = w;
      }
      function ssGo(i) {
        clearTimeout(SS.tm);
        SS.end = 0;
        SS.i = Math.max(0, Math.min(SS.evs.length - 1, i));
        const el = SS.evs[SS.i],
          e = (S.events || []).find((x) => x.id === el.dataset.id);
        if (!e) return;
        SS.evs.forEach((x) => x.classList.remove("cur"));
        el.classList.add("cur");
        const lr = tl.getBoundingClientRect(),
          er = el.getBoundingClientRect();
        tl.scrollTo({
          left: tl.scrollLeft + er.left - lr.left - tl.clientWidth / 2,
          behavior: "smooth",
        });
        const c = $("#ss");
        c.className = (el.className.match(/\ba-\w+/) || [""])[0];
        $(".ss-d", c) || 0;
        c.querySelector(".ss-d").textContent = e.date || "—";
        c.querySelector(".ss-n").textContent = SS.i + 1 + " / " + SS.evs.length;
        c.querySelector(".ss-t").textContent = e.title || "";
        const x = c.querySelector(".ss-x");
        x.innerHTML = esc(e.text || "").replace(/\n/g, "<br>");
        redact(x);
        const ch = c.querySelector(".ss-ch");
        ch.innerHTML = (e.refs || [])
          .map((r) => byId(r))
          .filter(Boolean)
          .map(
            (n) =>
              `<button class="chip" data-go="${n.id}">${esc(n.name)}</button>`,
          )
          .join("");
        ch.querySelectorAll("[data-go]").forEach((b) => {
          if (CXI(b.dataset.go)) cxText(b);
        });
        c.classList.remove("ss-sw");
        void c.offsetWidth;
        c.classList.add("ss-sw");
        SS.dur = ssDur(e);
        SS.rem = SS.dur;
        ssBtn();
        if (SS.play) ssRun();
        else {
          const b = ssBar();
          b.style.transition = "none";
          b.style.width = "0";
        }
      }
      function ssEnd() {
        clearTimeout(SS.tm);
        SS.play = 0;
        SS.end = 1;
        const b = ssBar();
        b.style.transition = "none";
        b.style.width = "100%";
        ssBtn();
        toast("Конец хронологии");
      }
      function ssToggle() {
        if (SS.play) {
          ssPause();
          SS.play = 0;
        } else if (SS.end) {
          SS.play = 1;
          ssGo(0);
          return;
        } else {
          SS.play = 1;
          ssRun();
        }
        ssBtn();
      }
      function ssStop() {
        if (!SS.on) return;
        clearTimeout(SS.tm);
        SS.on = 0;
        SS.play = 0;
        document.body.classList.remove("ss-on");
        $("#tl").classList.remove("show");
        SS.evs.forEach((x) => x.classList.remove("cur"));
        if (document.fullscreenElement)
          document.exitFullscreen().catch(() => {});
      }
      function ssStart() {
        if (tab !== "time") return;
        const evs = [...document.querySelectorAll("#tltrack .ev")];
        if (!evs.length) {
          toast("Нет событий для показа");
          return;
        }
        Object.assign(SS, { evs, on: 1, sp: 1, play: 1, end: 0 });
        $('[data-ss="sp"]').textContent = "1×";
        document.body.classList.add("ss-on");
        $("#tl").classList.add("show");
        ssGo(0);
      }
      const ssFs = () => {
        if (document.fullscreenElement) {
          document.exitFullscreen().catch(() => {});
        } else
          document.documentElement.requestFullscreen &&
            document.documentElement.requestFullscreen().catch(() => {});
      };
      $("#t-show").onclick = ssStart;
      $("#ss").addEventListener("click", (e) => {
        const b = e.target.closest("button");
        if (!b) return;
        const d = b.dataset;
        if (d.go) {
          ssStop();
          go(d.go);
          return;
        }
        if (d.ss === "x") ssStop();
        else if (d.ss === "play") ssToggle();
        else if (d.ss === "next")
          SS.i < SS.evs.length - 1 ? ssGo(SS.i + 1) : ssEnd();
        else if (d.ss === "prev") ssGo(SS.i - 1);
        else if (d.ss === "fs") ssFs();
        else if (d.ss === "sp") {
          SS.sp = SPD[(SPD.indexOf(SS.sp) + 1) % SPD.length];
          b.textContent = SS.sp + "×";
          if (SS.play) {
            const el = SS.evs[SS.i],
              e2 = (S.events || []).find((x) => x.id === el.dataset.id);
            SS.dur = ssDur(e2);
            SS.rem = SS.dur;
            ssRun();
          }
        }
      });
      addEventListener(
        "keydown",
        (e) => {
          if (!SS.on || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
          const k = e.key;
          if (k === "Escape") {
            e.stopPropagation();
            ssStop();
          } else if (k === " ") {
            e.preventDefault();
            ssToggle();
          } else if (k === "ArrowRight") {
            e.preventDefault();
            SS.i < SS.evs.length - 1 ? ssGo(SS.i + 1) : ssEnd();
          } else if (k === "ArrowLeft") {
            e.preventDefault();
            ssGo(SS.i - 1);
          } else if (k === "f" || k === "F") ssFs();
        },
        true,
      );
      const _st9 = setTab;
      setTab = function (t) {
        if (SS.on && t !== "time") ssStop();
        _st9(t);
      };
      const _rt9 = renderTL;
      renderTL = function () {
        if (SS.on) ssStop();
        _rt9();
      };
      const HAD = (() => {
        try {
          return !!localStorage.getItem(KEY);
        } catch (e) {
          return false;
        }
      })();
      const pull = (fb) =>
        fetch("data.json", { cache: "no-cache" })
          .then((r) => (r.ok ? r.json() : Promise.reject()))
          .then((j) => {
            if (!j.nodes) throw 0;
            S = j;
            S.links = S.links || [];
            S.home = S.home || seedHome();
            save();
            render();
            fit();
          })
          .catch(() => {
            if (fb) {
              S = seed();
              S.home = seedHome();
              layout(false);
              render();
              fit();
            }
          });
      if (VIEW) pull(true);
      else if (!HAD) pull(false);
      tab = "home";
      document.body.dataset.tab = "home";
      try {
        const t = localStorage.getItem(KEY + "-t");
        if (t) document.documentElement.dataset.theme = t;
      } catch (e) {}
      if (load()) layout(false);
      if (!S.home) S.home = seedHome();
      render();
      fit();
    </script>
  </body>
</html>
