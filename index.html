<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Horizon Unknown — Canon Hub</title>
    <link
      rel="icon"
      type="image/svg+xml" href="./favicon.svg"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;600&family=Playfair+Display:ital,wght@0,600;1,400&family=Lora:ital,wght@0,400;0,600;1,400;1,600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #e9e6e0;
        --card: #faf8f4;
        --ink: #17181c;
        --mute: #6b675f;
        --line: #9a948a;
        --bd: #d6d1c7;
        --dot: #cfc9bd;
        --c-char: #6b0000;
        --c-org: #1a2a3a;
        --c-story: #d9830f;
        --glass: rgba(250, 248, 244, 0.82);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0b0b0d;
          --card: #16161a;
          --ink: #ece8e1;
          --mute: #8f8a82;
          --line: #5b5750;
          --bd: #2b2a2e;
          --dot: #1e1e22;
          --c-char: #c23a2e;
          --c-org: #6f95b5;
          --c-story: #f0a02a;
          --glass: rgba(22, 22, 26, 0.84);
        }
      }
      :root[data-theme="dark"] {
        --bg: #0b0b0d;
        --card: #16161a;
        --ink: #ece8e1;
        --mute: #8f8a82;
        --line: #5b5750;
        --bd: #2b2a2e;
        --dot: #1e1e22;
        --c-char: #c23a2e;
        --c-org: #6f95b5;
        --c-story: #f0a02a;
        --glass: rgba(22, 22, 26, 0.84);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--bg);
        color: var(--ink);
        font:
          400 14px/1.45 Jost,
          system-ui,
          sans-serif;
      }
      #stage {
        position: fixed;
        inset: 0;
        background-image: radial-gradient(var(--dot) 1.5px, transparent 1.5px);
        background-size: 32px 32px;
        cursor: grab;
        touch-action: none;
      }
      #stage:active {
        cursor: grabbing;
      }
      #world {
        position: absolute;
        left: 0;
        top: 0;
        transform-origin: 0 0;
      }
      #lk {
        position: absolute;
        left: 0;
        top: 0;
        overflow: visible;
        pointer-events: none;
      }
      .lnk path {
        fill: none;
        stroke: var(--line);
        stroke-width: 1.5;
        transition:
          stroke 0.3s,
          opacity 0.3s;
      }
      .lnk text {
        fill: var(--mute);
        font:
          italic 13px "Playfair Display",
          serif;
        text-anchor: middle;
        paint-order: stroke;
        stroke: var(--bg);
        stroke-width: 5px;
        stroke-linejoin: round;
      }
      .lnk.on path {
        stroke: var(--ink);
        stroke-width: 2;
        stroke-dasharray: 6 5;
        animation: flow 1s linear infinite;
      }
      @keyframes flow {
        to {
          stroke-dashoffset: -11;
        }
      }
      .focus .lnk:not(.on) {
        opacity: 0.12;
      }
      .focus .node:not(.on) {
        opacity: 0.25;
      }
      .node {
        --ac: var(--c-char);
        position: absolute;
        width: 176px;
        transform: translate(-50%, -50%);
        background: var(--card);
        border: 1px solid var(--bd);
        border-top: 3px solid var(--ac);
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.14);
        cursor: pointer;
        user-select: none;
        transition:
          transform 0.25s,
          box-shadow 0.25s,
          opacity 0.3s;
        animation: pop 0.6s cubic-bezier(0.2, 0.9, 0.3, 1.2) backwards;
      }
      .node.org {
        --ac: var(--c-org);
      }
      .node.story {
        --ac: var(--c-story);
        width: 150px;
      }
      .node:hover {
        transform: translate(-50%, -50%) scale(1.06);
        box-shadow: 0 14px 34px rgba(0, 0, 0, 0.28);
        z-index: 5;
      }
      @keyframes pop {
        from {
          opacity: 0;
          transform: translate(-50%, -50%) scale(0.55);
        }
      }
      .ph {
        aspect-ratio: 1;
        background: linear-gradient(145deg, var(--ac), var(--bg));
        display: grid;
        place-items: center;
        overflow: hidden;
        color: #fff;
        font:
          600 44px "Playfair Display",
          serif;
      }
      .org .ph {
        aspect-ratio: 16/10;
      }
      .story .ph {
        aspect-ratio: 2/3;
      }
      .ph img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        filter: saturate(0.85);
        transition:
          filter 0.3s,
          transform 0.6s;
      }
      .node:hover .ph img {
        filter: none;
        transform: scale(1.07);
      }
      .tx {
        padding: 9px 11px 11px;
      }
      .tx b {
        display: block;
        font-weight: 600;
        font-size: 15px;
        line-height: 1.2;
      }
      .tx i {
        display: block;
        font-style: normal;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        font-size: 10px;
        color: var(--ac);
        margin: 2px 0 4px;
      }
      .tx p {
        margin: 0;
        font-size: 12px;
        color: var(--mute);
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      #bar {
        position: fixed;
        left: 10px;
        right: 10px;
        top: calc(env(safe-area-inset-top, 0px) + 10px);
        z-index: 20;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
        padding: 8px 10px;
        background: var(--glass);
        backdrop-filter: blur(10px);
        border: 1px solid var(--bd);
        transition:
          opacity 0.4s,
          transform 0.4s;
      }
      #bar h1 {
        margin: 0 10px 0 2px;
        font:
          italic 400 18px "Playfair Display",
          serif;
        white-space: nowrap;
      }
      #bar h1 small {
        font: 300 10px Jost;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--mute);
        margin-left: 6px;
      }
      button {
        font:
          400 13px Jost,
          sans-serif;
        color: var(--ink);
        background: transparent;
        border: 1px solid var(--bd);
        padding: 6px 11px;
        cursor: pointer;
        transition:
          background 0.2s,
          color 0.2s,
          border-color 0.2s;
      }
      button:hover {
        background: var(--ink);
        color: var(--bg);
        border-color: var(--ink);
      }
      button.pri {
        border-color: var(--c-char);
        color: var(--c-char);
      }
      button.pri:hover {
        background: var(--c-char);
        color: #fff;
      }
      .sp {
        flex: 1;
      }
      #legend {
        position: fixed;
        left: 14px;
        bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
        z-index: 10;
        display: flex;
        gap: 14px;
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--mute);
      }
      #legend span:before {
        content: "";
        display: inline-block;
        width: 9px;
        height: 9px;
        margin-right: 6px;
        background: var(--c);
      }
      .ov {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: none;
        align-items: center;
        justify-content: center;
        padding: calc(env(safe-area-inset-top, 0px) + 14px) 14px
          calc(env(safe-area-inset-bottom, 0px) + 14px);
        background: rgba(0, 0, 0, 0);
        backdrop-filter: blur(0);
        transition:
          background 0.3s,
          backdrop-filter 0.3s;
      }
      .ov.open {
        background: rgba(0, 0, 0, 0.55);
        backdrop-filter: blur(6px);
      }
      .panel {
        --ac: var(--c-char);
        width: min(780px, 100%);
        max-height: 100%;
        overflow: auto;
        background: var(--card);
        border-top: 4px solid var(--ac);
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
        transform: scale(0.2);
        opacity: 0;
        transition:
          transform 0.4s cubic-bezier(0.2, 0.9, 0.3, 1.1),
          opacity 0.3s;
      }
      .panel.org {
        --ac: var(--c-org);
      }
      .panel.story {
        --ac: var(--c-story);
      }
      .ov.open .panel {
        transform: none;
        opacity: 1;
      }
      .pv {
        display: grid;
        grid-template-columns: minmax(0, 5fr) minmax(0, 7fr);
      }
      @media (max-width: 620px) {
        .pv {
          grid-template-columns: 1fr;
        }
      }
      .big {
        background: linear-gradient(145deg, var(--ac), var(--bg));
        min-height: 260px;
        display: grid;
        place-items: center;
        font:
          600 90px "Playfair Display",
          serif;
        color: #fff;
        overflow: hidden;
      }
      .big img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .body {
        padding: 22px 24px;
      }
      .kind {
        text-transform: uppercase;
        letter-spacing: 0.2em;
        font-size: 10px;
        color: var(--ac);
      }
      h2 {
        margin: 2px 0 0;
        font:
          600 28px/1.1 "Playfair Display",
          serif;
      }
      .sub {
        color: var(--mute);
        margin-bottom: 12px;
      }
      blockquote {
        margin: 12px 0;
        padding-left: 12px;
        border-left: 2px solid var(--ac);
        font:
          italic 400 16px "Playfair Display",
          serif;
      }
      .body > * {
        animation: rise 0.5s both;
      }
      .body > *:nth-child(2) {
        animation-delay: 0.05s;
      }
      .body > *:nth-child(3) {
        animation-delay: 0.1s;
      }
      .body > *:nth-child(4) {
        animation-delay: 0.15s;
      }
      .body > *:nth-child(n + 5) {
        animation-delay: 0.2s;
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
      }
      h4 {
        margin: 18px 0 6px;
        font: 600 11px Jost;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--mute);
      }
      .chip {
        margin: 0 6px 6px 0;
        border-radius: 99px;
      }
      .chip em {
        color: var(--mute);
        font-style: italic;
        margin-left: 6px;
      }
      .chip:hover em {
        color: inherit;
      }
      .act {
        margin-top: 18px;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .ed {
        padding: 22px 24px;
        display: grid;
        gap: 10px;
      }
      .ed label {
        display: grid;
        gap: 3px;
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--mute);
      }
      input,
      select,
      textarea {
        font:
          400 14px Jost,
          sans-serif;
        color: var(--ink);
        background: var(--bg);
        border: 1px solid var(--bd);
        padding: 7px 9px;
        width: 100%;
        text-transform: none;
        letter-spacing: 0;
      }
      textarea {
        min-height: 90px;
        resize: vertical;
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .thumb {
        width: 64px;
        height: 64px;
        object-fit: cover;
        background: var(--bg);
        flex: none;
      }
      .lrow {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid var(--bd);
        padding: 4px 0;
      }
      #tabs {
        display: flex;
        margin-right: 6px;
      }
      #tabs button {
        margin-right: -1px;
      }
      #tabs button.on {
        background: var(--ink);
        color: var(--bg);
        border-color: var(--ink);
      }
      body:not([data-tab="graph"])
        :is(#b-lay, #b-fit, #b-zo, #b-zi, #legend, #stage) {
        display: none !important;
      }
      #list {
        display: none;
        position: fixed;
        inset: 0;
        overflow: auto;
        padding: 0 14px calc(env(safe-area-inset-bottom, 0px) + 40px);
        z-index: 5;
      }

      .lh {
        max-width: 980px;
        margin: 0 auto 18px;
        display: flex;
        align-items: baseline;
        gap: 12px;
      }
      .lh h1 {
        margin: 0;
        font:
          italic 600 38px "Playfair Display",
          serif;
      }
      .lh span {
        color: var(--mute);
        letter-spacing: 0.2em;
      }
      @media (max-width: 480px) {
        .lh {
          flex-wrap: wrap;
          align-items: center;
        }
        .lh h1 {
          font-size: clamp(28px, 9vw, 38px);
        }
        .lh .dv-new {
          margin-left: auto;
        }
      }
      .empty {
        max-width: 980px;
        margin: 0 auto;
        color: var(--mute);
      }
      .item {
        --ac: var(--c-char);
        max-width: 980px;
        margin: 0 auto 16px;
        background: var(--card);
        border: 1px solid var(--bd);
        border-left: 4px solid var(--ac);
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
        transition:
          box-shadow 0.3s,
          transform 0.3s;
        animation: rise 0.55s both;
      }
      .item.org {
        --ac: var(--c-org);
      }
      .item.story {
        --ac: var(--c-story);
      }
      .item:hover {
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.2);
      }
      .hd {
        display: flex;
        cursor: pointer;
        min-height: 170px;
        user-select: none;
      }
      .im {
        position: relative;
        width: 200px;
        min-height: 170px;
        flex: none;
        background: linear-gradient(145deg, var(--ac), var(--bg));
        display: grid;
        place-items: center;
        color: #fff;
        font:
          600 48px "Playfair Display",
          serif;
        overflow: hidden;
      }
      .story .im {
        width: 130px;
        min-height: 195px;
      }
      .im img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.6s;
      }
      .hd:hover .im img {
        transform: scale(1.06);
      }
      .mid {
        flex: 1;
        min-width: 0;
        padding: 16px 8px 16px 20px;
        align-self: center;
      }
      .mid h3 {
        margin: 2px 0 4px;
        font:
          600 24px/1.15 "Playfair Display",
          serif;
      }
      .mid p {
        margin: 0;
        color: var(--mute);
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .chev {
        align-self: center;
        margin: 0 22px;
        width: 11px;
        height: 11px;
        border: solid var(--mute);
        border-width: 0 2px 2px 0;
        transform: rotate(45deg);
        transition: transform 0.35s;
        flex: none;
      }
      .item.open .chev {
        transform: rotate(-135deg);
      }
      .more {
        display: grid;
        grid-template-rows: 0fr;
        transition: grid-template-rows 0.45s cubic-bezier(0.3, 0.8, 0.3, 1);
      }
      .item.open .more {
        grid-template-rows: 1fr;
      }
      .more > div {
        overflow: hidden;
      }
      .mi {
        padding: 16px 24px 20px;
        border-top: 1px solid var(--bd);
        opacity: 0;
        transform: translateY(-8px);
        transition:
          opacity 0.4s 0.1s,
          transform 0.4s 0.1s;
      }
      .item.open .mi {
        opacity: 1;
        transform: none;
      }
      @media (max-width: 560px) {
        .im {
          width: 110px;
          min-height: 150px;
        }
        .story .im {
          width: 92px;
          min-height: 138px;
        }
        .hd {
          min-height: 150px;
        }
        .mid h3 {
          font-size: 19px;
        }
        .chev {
          margin: 0 12px;
        }
      }
      .item {
        --hl: #e0584a;
      }
      .item.org {
        --hl: #8fb4d4;
      }
      .item.story {
        --hl: #f5a623;
      }
      .hd {
        position: relative;
        min-height: 200px;
        color: #fff;
        overflow: hidden;
        align-items: center;
      }
      .bn {
        position: absolute;
        inset: 0;
        background: linear-gradient(120deg, var(--ac), #0b0b0d 85%);
      }
      .bn span {
        position: absolute;
        right: 80px;
        top: 50%;
        transform: translateY(-50%);
        font:
          600 110px "Playfair Display",
          serif;
        opacity: 0.14;
      }
      .bn img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.9s cubic-bezier(0.2, 0.8, 0.3, 1);
      }
      .hd:hover .bn img {
        transform: scale(1.05);
      }
      .shade {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          90deg,
          rgba(8, 8, 12, 0.86) 0%,
          rgba(8, 8, 12, 0.55) 45%,
          rgba(8, 8, 12, 0.04) 100%
        );
        transition: opacity 0.4s;
      }
      .hd:hover .shade {
        opacity: 0.8;
      }
      .mid {
        position: relative;
        z-index: 1;
        flex: none;
        align-self: center;
        max-width: min(560px, 78%);
        padding: 22px 26px 22px 40px;
      }
      .mid:before,
      .mid:after {
        content: "";
        position: absolute;
        width: 20px;
        height: 20px;
        border: 0 solid rgba(255, 255, 255, 0.85);
        transition:
          width 0.4s,
          height 0.4s;
      }
      .mid:before {
        left: 18px;
        top: 12px;
        border-width: 2px 0 0 2px;
      }
      .mid:after {
        right: 6px;
        bottom: 12px;
        border-width: 0 2px 2px 0;
      }
      .hd:hover .mid:before,
      .hd:hover .mid:after {
        width: 32px;
        height: 32px;
      }
      .hd .kind {
        color: var(--hl);
        letter-spacing: 0.26em;
        font-size: 11px;
      }
      .mid h3 {
        margin: 4px 0 8px;
        font:
          300 clamp(26px, 4.4vw, 42px)/1.05 Jost,
          sans-serif;
        letter-spacing: 0.03em;
        color: #fff;
        text-shadow: 0 2px 16px rgba(0, 0, 0, 0.55);
      }
      .mid p {
        color: #e6e1d8;
        font-size: 14px;
        max-width: 440px;
        border-left: 2px solid var(--hl);
        padding-left: 10px;
        -webkit-line-clamp: 2;
      }
      .chev {
        position: absolute;
        right: 22px;
        top: 50%;
        margin: -7px 0 0;
        border-color: #fff;
        filter: drop-shadow(0 1px 4px rgba(0, 0, 0, 0.6));
        z-index: 1;
      }
      @media (max-width: 560px) {
        .hd {
          min-height: 180px;
        }
        .shade {
          background: linear-gradient(
            90deg,
            rgba(8, 8, 12, 0.86),
            rgba(8, 8, 12, 0.45)
          );
        }
        .mid {
          max-width: 100%;
          padding: 18px 40px 18px 28px;
        }
        .mid:before {
          left: 10px;
        }
      }
      :root {
        --g-hz: rgba(217, 131, 15, 0.28);
        --g-red: rgba(107, 0, 0, 0.13);
        --g-navy: rgba(26, 42, 58, 0.16);
        --vg: rgba(30, 20, 10, 0.18);
        --hzl: rgba(130, 95, 50, 0.55);
        --grain: 0.16;
        --dot: rgba(110, 90, 60, 0.22);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --g-hz: rgba(240, 160, 42, 0.2);
          --g-red: rgba(194, 58, 46, 0.22);
          --g-navy: rgba(70, 110, 150, 0.26);
          --vg: rgba(0, 0, 0, 0.6);
          --hzl: rgba(240, 160, 42, 0.55);
          --grain: 0.2;
          --dot: rgba(255, 255, 255, 0.07);
        }
      }
      :root[data-theme="dark"] {
        --g-hz: rgba(240, 160, 42, 0.2);
        --g-red: rgba(194, 58, 46, 0.22);
        --g-navy: rgba(70, 110, 150, 0.26);
        --vg: rgba(0, 0, 0, 0.6);
        --hzl: rgba(240, 160, 42, 0.55);
        --grain: 0.2;
        --dot: rgba(255, 255, 255, 0.07);
      }
      #bg {
        position: fixed;
        inset: -4%;
        pointer-events: none;
        background:
          radial-gradient(60% 26% at 50% 64%, var(--g-hz), transparent 70%),
          radial-gradient(45% 55% at 8% 100%, var(--g-red), transparent 70%),
          radial-gradient(50% 60% at 95% 0%, var(--g-navy), transparent 70%),
          radial-gradient(120% 90% at 50% 50%, transparent 55%, var(--vg));
        transition: transform 0.6s cubic-bezier(0.3, 0.8, 0.3, 1);
      }
      #bg:before {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        top: 64%;
        height: 1px;
        background: linear-gradient(
          90deg,
          transparent,
          var(--hzl) 30%,

        width: 230px;
        padding: 12px 14px;
        background: var(--card);
        border: 1px solid var(--bd);
        border-top: 3px solid var(--ac);
        box-shadow: 0 8px 26px rgba(0, 0, 0, 0.2);
        transition: box-shadow 0.3s;
      }
      .ev .card:hover {
        box-shadow: 0 16px 44px rgba(0, 0, 0, 0.35);
      }
      .ev.up .card {
        bottom: calc(50% + 36px);
      }
      .ev.dn .card {
        top: calc(50% + 36px);
      }
      .ev .card:before {
        content: "";
        position: absolute;
        left: 50%;
        width: 1px;
        height: 36px;
        background: var(--ac);
      }
      .up .card:before {
        top: 100%;
      }
      .dn .card:before {
        bottom: 100%;
      }
      .ev .card b {
        display: block;
        font:
          600 15px/1.25 Jost,
          sans-serif;
      }
      .more2 {
        max-height: 0;
        overflow: hidden;
        opacity: 0;
        transition:
          max-height 0.5s,
          opacity 0.35s;
        color: var(--mute);
        font-size: 13px;
      }
      .ev .card:hover .more2,
      .ev.open .more2 {
        max-height: 380px;
        opacity: 1;
        margin-top: 8px;
      }
      .dt {
        position: absolute;
        left: -60px;
        width: 120px;
        text-align: center;
        font:
          11px ui-monospace,
          Menlo,
          monospace;
        letter-spacing: 0.1em;
        color: var(--mute);
      }
      .up .dt {
        top: calc(50% + 16px);
      }
      .dn .dt {
        bottom: calc(50% + 16px);
      }
      #tbar {
        position: fixed;
        left: 50%;
        transform: translateX(-50%);
        bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
        z-index: 20;
        display: none;
        gap: 6px;
        padding: 8px;
        background: var(--glass);
        backdrop-filter: blur(14px);
        border: 1px solid var(--bd);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
      }
      body[data-tab="time"] #tbar {
        display: flex;
      }
      html.view
        :is(
          #newwrap,
          #b-data,
          #hbar,
          #t-add,
          [data-edit],
          [data-ed],
          [data-evedit],
          [data-stedit],
          [data-spreset],
          .rz
        ) {
        display: none !important;
      }

      /* ===== v4: drag, relations ===== */
      .node {
        animation: none;
        touch-action: none;
        transition:
          transform 0.45s cubic-bezier(0.2, 0.9, 0.3, 1.4),
          box-shadow 0.3s,
          opacity 0.3s;
      }
      .node[data-new="1"] {
        animation: pop 0.6s cubic-bezier(0.2, 0.9, 0.3, 1.2) backwards;
      }
      .node img {
        pointer-events: none;
        -webkit-user-drag: none;
        user-select: none;
      }
      .node.dragging {
        transform: translate(-50%, -50%) scale(1.08) rotate(-1.5deg);
        box-shadow: 0 28px 56px rgba(0, 0, 0, 0.42);
        z-index: 30;
        cursor: grabbing;
        transition:
          transform 0.18s,
          box-shadow 0.18s;
      }
      .node.dragging:after {
        content: "";
        position: absolute;
        inset: -7px;
        border: 1px dashed var(--ac);
        pointer-events: none;
        animation: flow 1s linear infinite;
        opacity: 0.8;
      }
      body.dragging-node,
      body.dragging-node * {
        cursor: grabbing !important;
      }
      .rels {
        margin-top: 6px;
      }
      .rels h4 .cnt,
      .lm h4 .cnt {
        color: var(--ac);
        margin-left: 6px;
      }
      .rm {
        display: block;
        width: 100%;
        height: auto;
        margin: 2px 0 12px;
        overflow: visible;
        background: radial-gradient(
          ellipse at 50% 50%,
          rgba(127, 127, 127, 0.14),
          transparent 68%
        );
      }
      .rm-l path {
        fill: none;
        stroke: var(--kc);
        stroke-dasharray: var(--kd);
        stroke-width: 1.7;
      }
      .rm-l {
        opacity: 0.8;
        transition: opacity 0.25s;
        animation: rlf 0.6s both;
      }
      .rm-l.on {
        opacity: 1;
      }
      .rm-l.on path {
        stroke-width: 3;
      }
      .rm-t {
        font:
          italic 10px "Playfair Display",
          serif;
        fill: var(--mute);
        text-anchor: middle;
        paint-order: stroke;
        stroke: var(--card);
        stroke-width: 4px;
        stroke-linejoin: round;
      }
      .rm-n {
        --ac: var(--c-char);
        cursor: pointer;
        transition: opacity 0.25s;
        animation: fly 0.7s cubic-bezier(0.2, 0.9, 0.3, 1.2) both;
      }
      .rm-n.org {
        --ac: var(--c-org);
      }
      .rm-n.story {
        --ac: var(--c-story);
      }
      .rm-n circle {
        fill: var(--ac);
        stroke: var(--card);
        stroke-width: 3;
        transition: r 0.25s;
      }
      .rm-n:hover circle,
      .rm-n.on circle {
        r: 23px;
      }
      .rm-n text {
        fill: #fff;
        font:
          600 11px Jost,
          sans-serif;
        text-anchor: middle;
        dominant-baseline: central;
        pointer-events: none;
      }
      .rm-n .nm {
        fill: var(--ink);
        font:
          500 10px Jost,
          sans-serif;
        dominant-baseline: auto;
      }
      .rm-c {
        cursor: default;
        animation: none;
      }
      .rm-c text {
        font-size: 14px;
      }
      .rm-p {
        fill: none;
        stroke: var(--ac);
        stroke-width: 1.5;
        animation: ring 2.4s ease-out infinite;
      }
      .rm.hl .rm-l:not(.on) {
        opacity: 0.1;
      }
      .rm.hl .rm-n:not(.on):not(.rm-c) {
        opacity: 0.3;
      }
      .rm-l.hide,
      .rm-n.hide {
        opacity: 0 !important;
        pointer-events: none;
      }
      @keyframes fly {
        from {
          transform: translate(var(--dx), var(--dy));
          opacity: 0;
        }
      }
      @keyframes rlf {
        from {
          opacity: 0;
        }
      }
      @keyframes ring {
        from {
          r: 26px;
          opacity: 0.8;
        }
        to {
          r: 50px;
          opacity: 0;
        }
      }
      .rk {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin: 0 0 10px;
      }
      .rk button {
        border-radius: 99px;
        border-left: 4px solid var(--kc);
        font-size: 12px;
        padding: 4px 10px;
        transition:
          opacity 0.25s,
          background 0.2s;
      }
      .rk button b {
        font-weight: 600;
        margin-left: 4px;
        color: var(--mute);
      }
      .rk button.off {
        opacity: 0.38;
      }
      .rk button:hover {
        background: rgba(127, 127, 127, 0.15);
        color: var(--ink);
      }
      .rl {
        display: grid;
        gap: 6px;
      }
      .rl-row {
        --ac: var(--c-char);
        display: grid;
        grid-template-columns: 40px 1fr auto;
        gap: 12px;
        align-items: center;
        width: 100%;
        text-align: left;
        text-transform: none;
        letter-spacing: 0;
        padding: 8px 12px 8px 10px;
        border: 1px solid var(--bd);
        border-left: 3px solid var(--kc);
        background: rgba(127, 127, 127, 0.06);
        max-height: 72px;
        overflow: hidden;
        animation: rise 0.45s both;
        transition:
          transform 0.25s,
          background 0.25s,
          box-shadow 0.25s,
          opacity 0.3s,
          max-height 0.35s,
          padding 0.35s,
          margin 0.35s;
      }
      .rl-row.org,
      .lm-row.org,
      .lm-opt.org {
        --ac: var(--c-org);
      }
      .rl-row.story,
      .lm-row.story,
      .lm-opt.story {
        --ac: var(--c-story);
      }
      .rl-row:hover,
      .rl-row.on {
        background: var(--card);
        color: var(--ink);
        border-color: var(--kc);
        transform: translateX(5px);
        box-shadow: 0 8px 22px rgba(0, 0, 0, 0.2);
      }
      .rl-row.hide {
        max-height: 0;
        padding-top: 0;
        padding-bottom: 0;
        margin: -3px 0;
        opacity: 0;
        border-width: 0;
        pointer-events: none;
      }
      .rl-av,
      .lm-av {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        overflow: hidden;
        flex: none;
        background: linear-gradient(
          145deg,
          var(--ac, var(--c-char)),
          var(--bg)
        );
        color: #fff;
        font:
          600 15px "Playfair Display",
          serif;
      }
      .rl-av img,
      .lm-av img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .rl-tx b {
        display: block;
        font-size: 15px;
        line-height: 1.2;
      }
      .rl-tx i {
        display: block;
        font-style: normal;
        font-size: 11px;
        color: var(--mute);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .rl-tag {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 11px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--kc);
        text-align: right;
      }
      .rl-tag s {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--kc);
        flex: none;
      }
      .rl-tag u {
        text-decoration: none;
        font-size: 15px;
        transition: transform 0.25s;
      }
      .rl-row:hover .rl-tag u {
        transform: translateX(4px);
      }
      .rl-empty {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        padding: 14px;
        border: 1px dashed var(--bd);
        color: var(--mute);
      }
      @media (max-width: 480px) {
        .rl-row {
          grid-template-columns: 36px 1fr;
        }
        .rl-tag {
          grid-column: 2;
        }
      }
      .lm {
        display: grid;
        gap: 8px;
      }
      .lm-row {
        --ac: var(--c-char);
        display: grid;
        grid-template-columns: 34px 1fr auto auto;
        gap: 8px;
        align-items: center;
        padding: 6px 8px;
        border: 1px solid var(--bd);
        border-left: 3px solid var(--kc);
        background: rgba(127, 127, 127, 0.06);
        animation: rise 0.4s both;
        transition: border-color 0.25s;
      }
      .lm-av {
        width: 34px;
        height: 34px;
        font-size: 13px;
      }
      .lm-m b {
        display: block;
        font-size: 13px;
      }
      .lm-m small {
        color: var(--mute);
      }
      .lm-m input {
        border: 0;
        border-bottom: 1px dashed var(--bd);
        background: transparent;
        padding: 2px 0;
        font-size: 12px;
        color: var(--mute);
      }
      .lm-m input:focus {
        outline: 0;
        border-bottom-color: var(--kc);
        color: var(--ink);
      }
      .lm-k {
        width: auto;
        font-size: 12px;
        padding: 5px 6px;
        border-color: var(--kc);
      }
      .lm-x {
        width: 28px;
        height: 28px;
        padding: 0;
        border-radius: 50%;
        line-height: 1;
      }
      .lm-x:hover {
        background: var(--c-char);
        border-color: var(--c-char);
        color: #fff;
        transform: rotate(90deg);
      }
      .lm-x {
        transition:
          transform 0.3s,
          background 0.2s;
      }
      .lm-new {
        display: grid;
        gap: 8px;
        padding: 12px;
        border: 1px dashed var(--mute);
        background: var(--glass);
      }
      .lm-t {
        font-size: 11px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--mute);
      }
      .lm-res {
        display: grid;
        max-height: 180px;
        overflow: auto;
        border: 1px solid var(--bd);
        background: var(--card);
      }
      .lm-res:empty {
        display: none;
      }
      .lm-opt {
        --ac: var(--c-char);
        display: flex;
        align-items: center;
        gap: 10px;
        border: 0;
        border-bottom: 1px solid var(--bd);
        text-align: left;
        padding: 6px 10px;
        text-transform: none;
        letter-spacing: 0;
      }
      .lm-opt i {
        display: block;
        font-style: normal;
        font-size: 11px;
        color: var(--mute);
      }
      .lm-opt:hover i {
        color: inherit;
      }
      .lm-kinds {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .lm-kinds button {
        border-radius: 99px;
        font-size: 12px;
        padding: 4px 11px;
        border-left: 4px solid var(--kc);
        opacity: 0.55;
        transition:
          opacity 0.2s,
          background 0.2s,
          transform 0.2s;
      }
      .lm-kinds button:hover {
        background: rgba(127, 127, 127, 0.15);
        color: var(--ink);
        opacity: 1;
      }
      .lm-kinds button.on,
      .lm-kinds button.on:hover {
        opacity: 1;
        background: var(--kc);
        color: #fff;
        border-color: var(--kc);
        transform: scale(1.05);
      }
      .shake {
        animation: shake 0.4s;
      }
      @keyframes shake {
        25% {
          transform: translateX(-5px);
        }
        75% {
          transform: translateX(5px);
        }
      }

      /* ===== v5: graph HUD, org structs, delete, live bg ===== */
      body:not([data-tab="graph"]) :is(#gdock, #mm) {
        display: none !important;
      }
      html.view :is([data-delnode], [data-evdel]) {
        display: none !important;
      }
      #legend {
        display: block;
        width: 214px;
        padding: 0;
        gap: 0;
        background: var(--glass);
        backdrop-filter: blur(14px) saturate(1.3);
        border: 1px solid var(--bd);
        box-shadow: 0 12px 36px rgba(0, 0, 0, 0.25);
        text-transform: none;
        letter-spacing: 0;
        font-size: 12px;
        color: var(--ink);
        animation: drop 0.8s 0.3s both cubic-bezier(0.2, 0.8, 0.3, 1);
      }
      #legend:before {
        content: "";
        display: block;
        height: 2px;
        background: linear-gradient(
          90deg,
          var(--c-char),
          var(--c-org),
          var(--c-story)
        );
      }
      .lg-h {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 9px 12px;
        cursor: pointer;
        user-select: none;
      }
      .lg-h strong {
        font:
          600 10px Jost,
          sans-serif;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        flex: 1;
      }
      .lg-h em {
        font:
          11px ui-monospace,
          Menlo,
          monospace;
        color: var(--mute);
        font-style: normal;
      }
      .lg-h i {
        width: 7px;
        height: 7px;
        border: solid var(--mute);
        border-width: 0 2px 2px 0;
        transform: rotate(45deg);
        transition: transform 0.3s;
      }
      #legend.min .lg-h i {
        transform: rotate(-135deg);
      }
      .lg-b {
        display: grid;
        gap: 2px;
        padding: 0 8px 10px;
        max-height: 380px;
        overflow: hidden;
        transition:
          max-height 0.4s,
          opacity 0.3s,
          padding 0.3s;
      }
      #legend.min .lg-b {
        max-height: 0;
        opacity: 0;
        padding-bottom: 0;
      }
      .lg-s {
        font:
          600 9px Jost,
          sans-serif;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: var(--mute);
        margin: 8px 4px 3px;
      }
      .lg-b button {
        display: flex;
        align-items: center;
        gap: 8px;
        border: 0;
        padding: 5px 6px;
        font-size: 12px;
        text-align: left;
        transition:
          opacity 0.25s,
          background 0.2s,
          transform 0.2s;
      }
      .lg-b button b {
        margin-left: auto;
        font:
          11px ui-monospace,
          Menlo,
          monospace;
        color: var(--mute);
      }
      .lg-b button:hover {
        background: rgba(127, 127, 127, 0.15);
        color: var(--ink);
        transform: translateX(3px);
      }
      .lg-b button.off {
        opacity: 0.35;
      }
      .lg-b s {
        width: 10px;
        height: 10px;
        background: var(--c);
        flex: none;
      }
      .lg-b svg {
        flex: none;
      }
      .lg-b line {
        stroke: var(--c);
        stroke-width: 2.2;
        stroke-dasharray: var(--kd);
      }
      #gdock {
        position: fixed;
        right: 14px;
        top: 50%;
        transform: translateY(-50%);
        z-index: 12;
        display: grid;
        background: var(--glass);
        backdrop-filter: blur(14px);
        border: 1px solid var(--bd);
        box-shadow: 0 12px 36px rgba(0, 0, 0, 0.25);
        animation: drop 0.8s 0.4s both cubic-bezier(0.2, 0.8, 0.3, 1);
      }
      #gdock button {
        width: 42px;
        height: 42px;
        padding: 0;
        margin: 0;
        border: 0;
        border-bottom: 1px solid var(--bd);
        display: grid;
        place-items: center;
        position: relative;
      }
      #gdock button:last-child {
        border-bottom: 0;
      }
      #gdock #b-lay:before {
        display: none;
      }
      #gdock svg {
        width: 18px;
        height: 18px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      #gdock .zp {
        font:
          10px ui-monospace,
          Menlo,
          monospace;
        text-align: center;
        padding: 7px 0;
        color: var(--mute);
        border-bottom: 1px solid var(--bd);
      }
      #gdock button.on {
        background: var(--ink);
        color: var(--bg);
      }
      #gdock button[data-tip]:hover:after {
        content: attr(data-tip);
        position: absolute;
        right: 50px;
        top: 50%;
        transform: translateY(-50%);
        white-space: nowrap;
        background: var(--ink);
        color: var(--bg);
        font-size: 11px;
        padding: 4px 8px;
        pointer-events: none;
      }
      body.nolbl .lnk text {
        display: none;
      }
      #mm {
        position: fixed;
        right: 14px;
        bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
        width: 190px;
        height: 124px;
        z-index: 11;
        background: var(--glass);
        backdrop-filter: blur(14px);
        border: 1px solid var(--bd);
        box-shadow: 0 12px 36px rgba(0, 0, 0, 0.25);
        cursor: crosshair;
        touch-action: none;
        overflow: hidden;
        animation: drop 0.8s 0.5s both cubic-bezier(0.2, 0.8, 0.3, 1);
      }
      #mm svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      #mm line {
        stroke: var(--mute);
        stroke-width: 0.6;
        opacity: 0.6;
      }
      #mm circle.char {
        fill: var(--c-char);
      }
      #mm circle.org {
        fill: var(--c-org);
      }
      #mm circle.story {
        fill: var(--c-story);
      }
      #mm .vp {
        fill: rgba(127, 127, 127, 0.12);
        stroke: var(--ink);
        stroke-width: 1;
        transition:
          x 0.1s,
          y 0.1s;
      }
      @media (max-width: 700px) {
        #mm {
          display: none;
        }
        #gdock {
          top: auto;
          bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
          transform: none;
        }
        #legend {
          width: 170px;
        }
      }
      .dng {
        border-color: var(--c-char);
        color: var(--c-char);
      }
      .dng:hover {
        background: var(--c-char);
        color: #fff;
        border-color: var(--c-char);
      }
      .dng.arm {
        background: var(--c-char);
        color: #fff;
        animation: shake 0.4s;
      }
      .item {
        transition:
          box-shadow 0.3s,
          transform 0.35s,
          max-width 0.55s cubic-bezier(0.3, 0.8, 0.3, 1),
          opacity 0.35s;
      }
      .item.gone {
        opacity: 0;
        transform: translateX(-40px) scale(0.97);
        pointer-events: none;
      }
      .sm {
        height: auto;
      }
      .sm b {
        white-space: normal;
        overflow-wrap: anywhere;
        line-height: 1.2;
      }
      .sm i {
        display: block;
        overflow-wrap: anywhere;
        line-height: 1.3;
        margin-top: 2px;
      }
      .cells .sm {
        width: auto;
        min-width: 170px;
        max-width: 300px;
        min-height: 60px;
      }
      .hud {
        animation: hudf 9s ease-in-out infinite;
      }
      .hud span {
        transition: opacity 0.8s ease;
      }
      @keyframes hudf {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.8;
        }
      }
      .blip {
        position: absolute;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--c-char);
        box-shadow: 0 0 14px 4px var(--c-char);
        opacity: 0;
        pointer-events: none;
        animation: blip 3.4s ease-out infinite;
      }
      @keyframes blip {
        0% {
          opacity: 0;
          transform: scale(0.3);
        }
        12% {
          opacity: 0.95;
        }
        100% {
          opacity: 0;
          transform: scale(2.4);
        }
      }
      .stwrap .st {
        margin: 0 auto;
      }
      .stwrap .cells {
        justify-content: center;
      }
      .stwrap > p {
        text-align: center;
      }

      /* ===== v6: story reader / editor ===== */
      html.view [data-write],
      html.view .rd-ed {
        display: none !important;
      }
      #rd {
        position: fixed;
        inset: 0;
        z-index: 60;
        display: none;
        flex-direction: column;
        background: var(--bg);
      }
      #rd.open {
        display: flex;
        animation: rdin 0.45s cubic-bezier(0.2, 0.8, 0.3, 1);
      }
      @keyframes rdin {
        from {
          opacity: 0;
          transform: translateY(24px) scale(0.985);
        }
      }
      .rd-top {
        position: relative;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: calc(env(safe-area-inset-top, 0px) + 8px) 12px 8px;
        background: var(--glass);
        backdrop-filter: blur(14px);
        border-bottom: 1px solid var(--bd);
      }
      .rd-t {
        font:
          italic 400 17px "Playfair Display",
          serif;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .rd-sp {
        flex: 1;
      }
      .rd-top button {
        padding: 6px 11px;
        font-size: 12px;
      }
      .rd-pg {
        position: absolute;
        left: 0;
        bottom: -1px;
        height: 2px;
        width: 0;
        background: linear-gradient(90deg, var(--c-char), var(--c-story));
      }
      .rd-tb {
        display: flex;
        gap: 2px;
        align-items: center;
        overflow-x: auto;
        padding: 5px 12px;
        background: var(--glass);
        backdrop-filter: blur(14px);
        border-bottom: 1px solid var(--bd);
      }
      .rd-tb button,
      .clr {
        min-width: 34px;
        height: 34px;
        padding: 0 8px;
        border: 0;
        font-size: 14px;
        flex: none;
        display: grid;
        place-items: center;
      }
      .rd-tb button.on {
        background: var(--ink);
        color: var(--bg);
      }
      .rd-tb select {
        width: auto;
        height: 34px;
        flex: none;
      }
      .rd-tb .sep {
        width: 1px;
        height: 20px;
        background: var(--bd);
        margin: 0 6px;
        flex: none;
      }
      .rd-tb svg {
        width: 16px;
        height: 16px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.8;
        stroke-linecap: round;
      }
      .clr {
        position: relative;
        cursor: pointer;
      }
      .clr input {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        opacity: 0;
        cursor: pointer;
        padding: 0;
      }
      .clr:hover {
        background: rgba(127, 127, 127, 0.18);
      }
      #rd:not(.edit) :is(.rd-tb, .rd-st) {
        display: none;
      }
      .rd-sc {
        flex: 1;
        overflow: auto;
        scroll-behavior: smooth;
      }
      .rd-st {
        padding: 6px 14px;
        font:
          11px ui-monospace,
          Menlo,
          monospace;
        color: var(--mute);
        border-top: 1px solid var(--bd);
        background: var(--glass);
      }
      .rd-hero {
        position: relative;
        min-height: 300px;
        display: flex;
        align-items: flex-end;
        color: #fff;
        overflow: hidden;
        background: linear-gradient(120deg, var(--c-story), #0b0b0d 85%);
      }
      .rd-hero img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .rd-hs {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          0deg,
          rgba(8, 8, 12, 0.9),
          rgba(8, 8, 12, 0.15)
        );
      }
      .rd-hi {
        position: relative;
        width: 100%;
        padding: 60px max(22px, calc((100% - 720px) / 2)) 34px;
      }
      .rd-hi small {
        letter-spacing: 0.3em;
        text-transform: uppercase;
        font-size: 11px;
        color: #f5a623;
      }
      .rd-hi h1 {
        margin: 6px 0 8px;
        font:
          300 clamp(30px, 5vw, 56px)/1.05 Jost,
          sans-serif;
        letter-spacing: 0.04em;
        animation: rise 0.7s both;
      }
      .rd-hi em {
        display: block;
        max-width: 560px;
        color: #e6e1d8;
        font:
          italic 16px "Playfair Display",
          serif;
      }
      .rd-meta {
        margin: 0 0 8px;
        font:
          12px ui-monospace,
          Menlo,
          monospace;
        color: #cfc9bd;
      }
      .rd-bw {
        max-width: 720px;
        margin: 0 auto;
        padding: 40px 22px 0;
      }
      .rd-body {
        position: relative;
        outline: 0;
        min-height: 50vh;
        padding-bottom: 140px;
        display: flow-root;
        font:
          400 calc(18px * var(--rfs, 1))/1.75 Lora,
          Georgia,
          serif;
        overflow-wrap: anywhere;
      }
      #rd.sans .rd-body {
        font-family: Jost, system-ui, sans-serif;
      }
      .rd-body.empty:before {
        content: attr(data-ph);
        position: absolute;
        color: var(--mute);
        pointer-events: none;
      }
      .rd-none {
        color: var(--mute);
        font-style: italic;
      }
      .rd-body p {
        margin: 0 0 1.1em;
      }
      .rd-body :is(h1, h2, h3, h4) {
        font:
          600 1.5em/1.2 "Playfair Display",
          serif;
        margin: 1.6em 0 0.5em;
      }
      .rd-body h1 {
        font-size: 2em;
      }
      .rd-body h3 {
        font-size: 1.25em;
      }
      #rd:not(.edit) .rd-body > p:first-of-type:not(.rd-none)::first-letter {
        float: left;
        font:
          600 3.4em/0.85 "Playfair Display",
          serif;
        padding: 0.08em 0.12em 0 0;
        color: var(--c-char);
      }
      .rd-body blockquote {
        margin: 1.4em 0;
        padding: 0.2em 0 0.2em 1.2em;
        border-left: 3px solid var(--c-story);
        font:
          italic 400 1.2em/1.5 "Playfair Display",
          serif;
      }
      .rd-body a {
        color: var(--c-char);
        text-underline-offset: 3px;
      }
      .rd-body a.mn {
        text-decoration: none;
        border-bottom: 1px dashed var(--c-char);
        background: rgba(127, 127, 127, 0.12);
        padding: 0 0.2em;
      }
      .rd-body :is(ul, ol) {
        margin: 0 0 1.1em;
        padding-left: 1.4em;
      }
      .rd-body li {
        margin: 0.2em 0;
      }
      .rd-body hr {
        border: 0;
        height: auto;
        text-align: center;
        margin: 2.2em 0;
        overflow: visible;
      }
      .rd-body hr:after {
        content: "✦  ✦  ✦";
        letter-spacing: 0.5em;
        color: var(--mute);
        font-size: 0.8em;
      }
      .rd-body figure {
        margin: 1.6em auto;
        width: 75%;
        text-align: center;
        border-radius: 2px;
      }
      .rd-body figure[data-size="s"] {
        width: 30%;
      }
      .rd-body figure[data-size="m"] {
        width: 50%;
      }
      .rd-body figure[data-size="f"] {
        width: 100%;
      }
      .rd-body figure img {
        width: 100%;
        display: block;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      }
      .rd-body figcaption {
        font:
          italic 13px Jost,
          sans-serif;
        color: var(--mute);
        margin-top: 0.6em;
        outline: 0;
      }
      .rd-body figure[data-al="l"] {
        float: left;
        margin: 0.3em 1.5em 1em 0;
      }
      .rd-body figure[data-al="r"] {
        float: right;
        margin: 0.3em 0 1em 1.5em;
      }
      .rd-body .sel {
        outline: 2px solid var(--c-char);
        outline-offset: 3px;
      }
      @media (max-width: 600px) {
        .rd-body figure[data-al] {
          float: none;
          margin: 1.2em auto;
        }
        .rd-body figure[data-size="s"],
        .rd-body figure[data-size="m"] {
          width: 70%;
        }
      }
      .rd-body aside.co {
        margin: 1.4em 0;
        padding: 0.9em 1.2em;
        border: 1px solid var(--bd);
        border-left: 4px solid var(--c-org);
        background: rgba(127, 127, 127, 0.08);
        font-family: Jost, sans-serif;
        font-size: 0.92em;
      }
      .rd-body aside.co p:last-child {
        margin: 0;
      }
      .rd-body aside.co[data-t="w"] {
        border-left-color: var(--c-story);
      }
      .rd-body aside.co[data-t="d"] {
        border-left-color: var(--c-char);
      }
      .rd-body table {
        width: 100%;
        border-collapse: collapse;
        margin: 1.4em 0;
        font:
          15px Jost,
          sans-serif;
      }
      .rd-body :is(td, th) {
        border: 1px solid var(--bd);
        padding: 8px 10px;
        min-width: 60px;
        vertical-align: top;
      }
      .rd-body th {
        background: rgba(127, 127, 127, 0.12);
        text-align: left;
      }
      .rd-body .sp {
        background: var(--ink);
        color: transparent;
        border-radius: 2px;
        cursor: pointer;
        transition:
          background 0.45s,
          color 0.45s 0.08s;
      }
      .rd-body .sp.show {
        background: var(--bd);
        color: var(--ink);
      }
      #rd.edit .rd-body .sp {
        background: rgba(127, 127, 127, 0.25);
        color: inherit;
        outline: 1px dashed var(--mute);
        cursor: text;
      }
      #rdpop {
        position: fixed;
        z-index: 80;
        width: 290px;
        display: none;
        gap: 8px;
        padding: 12px;
        background: var(--card);
        border: 1px solid var(--bd);
        box-shadow: 0 18px 44px rgba(0, 0, 0, 0.4);
      }
      #rdpop.open {
        display: grid;
      }
      #rdpop small,
      .rd-or {
        color: var(--mute);
        font-size: 11px;
      }
      #rdpop .pf {
        display: grid;
        gap: 4px;
        font-size: 12px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--mute);
      }
      #pml {
        display: grid;
        max-height: 200px;
        overflow: auto;
      }
      #pml button {
        border: 0;
        border-bottom: 1px solid var(--bd);
        text-align: left;
      }
      #figtb {
        position: fixed;
        z-index: 75;
        display: none;
        gap: 2px;
        background: var(--ink);
        padding: 3px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      }
      #figtb.open {
        display: flex;
      }
      #figtb button {
        color: var(--bg);
        border: 0;
        padding: 5px 9px;
        font-size: 12px;
      }
      #figtb button:hover {
        background: var(--bg);
        color: var(--ink);
      }
      #toast {
        position: fixed;
        left: 50%;
        bottom: 30px;
        transform: translate(-50%, 20px);
        z-index: 90;
        background: var(--ink);
        color: var(--bg);
        padding: 10px 16px;
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 0.3s,
          transform 0.3s;
        max-width: 90%;
      }
      #toast.on {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      /* ===== v7: corrupted ===== */
      .corrupt {
        position: relative;
        animation: cxj 3.1s steps(1) infinite !important;
        text-shadow:
          1.5px 0 rgba(255, 0, 60, 0.55),
          -1.5px 0 rgba(0, 200, 255, 0.45);
      }
      .node.corrupt {
        animation-duration: 2.3s !important;
      }
      .corrupt :is(img, .ph) {
        filter: grayscale(1) contrast(1.7) brightness(0.55) blur(1.2px);
      }
      .corrupt > *:not(.cx-b):not(.cx-sc) {
        animation: cxt 4.7s steps(1) infinite;
      }
      @keyframes cxj {
        0%,
        90%,
        100% {
          translate: 0 0;
          filter: none;
          clip-path: none;
          opacity: 1;
        }
        91% {
          translate: -4px 1px;
          filter: hue-rotate(60deg) contrast(1.5);
          clip-path: inset(0 0 55% 0);
        }
        92% {
          translate: 5px -1px;
          filter: invert(0.15);
          clip-path: inset(40% 0 0 0);
        }
        93% {
          translate: -2px 0;
          filter: none;
          clip-path: inset(18% 0 62% 0);
          opacity: 0.7;
        }
        94% {
          translate: 0 0;
          clip-path: none;
          opacity: 1;
        }
        96% {
          translate: 3px 0;
          filter: saturate(3) hue-rotate(-40deg);
        }
        97% {
          translate: 0 0;
          filter: none;
        }
      }
      @keyframes cxt {
        0%,
        84%,
        100% {
          opacity: 1;
        }
        85% {
          opacity: 0.35;
        }
        87% {
          opacity: 0.9;
          translate: 2px 0;
        }
        89% {
          opacity: 0.5;
          translate: -3px 0;
        }
        91% {
          opacity: 1;
          translate: 0 0;
        }
      }
      .cx-sc {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 2;
        background: repeating-linear-gradient(
          0deg,
          rgba(0, 0, 0, 0.22) 0 2px,
          transparent 2px 4px
        );
        mix-blend-mode: multiply;
        opacity: 0.8;
      }
      .cx-sc:after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        height: 22%;
        top: -25%;
        background: linear-gradient(
          180deg,
          transparent,
          rgba(255, 255, 255, 0.12),
          transparent
        );
        animation: cxs 3.4s linear infinite;
      }
      @keyframes cxs {
        to {
          top: 110%;
        }
      }
      .cx-b {
        position: absolute;
        top: 6px;
        right: 8px;
        z-index: 3;
        padding: 2px 7px;
        font:
          600 9px ui-monospace,
          Menlo,
          monospace;
        letter-spacing: 0.2em;
        color: #fff;
        background: var(--c-char);
        text-shadow: none;
        pointer-events: none;
        animation: cxb 1.6s steps(1) infinite;
      }
      @keyframes cxb {
        0%,
        60%,
        100% {
          opacity: 1;
        }
        65% {
          opacity: 0.2;
        }
        70% {
          opacity: 1;
        }
        80% {
          opacity: 0.5;
        }
      }
      .node.corrupt .cx-b {
        top: -9px;
        right: -4px;
        font-size: 8px;
        padding: 1px 5px;
      }
      .rl-row.corrupt,
      .corrupt .rl-row {
        pointer-events: auto;
      }
      #rd.corrupt .rd-sc {
        animation: cxj 3.1s steps(1) infinite;
        text-shadow:
          1.5px 0 rgba(255, 0, 60, 0.5),
          -1.5px 0 rgba(0, 200, 255, 0.4);
      }
      #rd.corrupt .rd-body {
        user-select: none;
      }
      .cx-tg {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        padding: 10px 12px;
        margin: 10px 0;
        border: 1px dashed var(--c-char);
        background: rgba(194, 58, 46, 0.08);
        cursor: pointer;
        text-transform: none;
        letter-spacing: 0;
        font-size: 13px;
      }
      .cx-tg input {
        width: auto;
        margin: 3px 0 0;
        flex: none;
        appearance: auto;
      }
      .cx-tg small {
        display: block;
        color: var(--mute);
        font-size: 11px;
        margin-top: 2px;
      }
      @media (prefers-reduced-motion: reduce) {
        .corrupt,
        .corrupt > *,
        .cx-sc:after,
        .cx-b,
        #rd.corrupt .rd-sc {
          animation: none !important;
        }
      }

      /* ===== v8: media library ===== */
      html.view :is(#b-media, .ml-pick, .ml-st) {
        display: none !important;
      }
      #ml {
        position: fixed;
        inset: 0;
        z-index: 85;
        display: none;
        place-items: center;
        background: rgba(0, 0, 0, 0.62);
        backdrop-filter: blur(6px);
      }
      #ml.open {
        display: grid;
        animation: rdin 0.3s both;
      }
      .ml-box {
        width: min(940px, 96vw);
        height: min(720px, 90vh);
        display: flex;
        flex-direction: column;
        background: var(--card);
        border: 1px solid var(--bd);
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
      }
      .ml-h {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 14px;
        border-bottom: 1px solid var(--bd);
      }
      .ml-h strong {
        font:
          600 18px "Playfair Display",
          serif;
      }
      .ml-h small {
        color: var(--mute);
      }
      .ml-h .sp,
      .ml-f .sp {
        flex: 1;
      }
      .ml-up {
        cursor: pointer;
        display: inline-block;
        padding: 7px 14px;
        border: 1px solid var(--c-char);
        color: var(--c-char);
        font-size: 12px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        transition:
          background 0.2s,
          color 0.2s;
      }
      .ml-up:hover {
        background: var(--c-char);
        color: #fff;
      }
      .ml-up input {
        display: none;
      }
      .ml-b {
        flex: 1;
        overflow: auto;
        padding: 14px;
        position: relative;
      }
      .ml-b.drag {
        outline: 2px dashed var(--c-char);
        outline-offset: -8px;
        background: rgba(194, 58, 46, 0.07);
      }
      .ml-g {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 10px;
      }
      .ml-i {
        padding: 0;
        border: 1px solid var(--bd);
        display: grid;
        grid-template-rows: 110px auto;
        text-align: left;
        overflow: hidden;
        background: rgba(127, 127, 127, 0.06);
        text-transform: none;
        letter-spacing: 0;
        animation: rise 0.4s both;
        transition:
          transform 0.25s,
          box-shadow 0.25s;
      }
      .ml-i:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.3);
        background: var(--card);
        color: var(--ink);
      }
      .ml-i img {
        width: 100%;
        height: 110px;
        object-fit: cover;
      }
      .ml-i span {
        padding: 5px 8px;
        font-size: 11px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: var(--mute);
      }
      .ml-m {
        color: var(--mute);
        text-align: center;
        padding: 40px 10px;
        line-height: 1.7;
      }
      .ml-m b {
        color: var(--ink);
      }
      .ml-cfg {
        max-width: 520px;
        margin: 0 auto;
        display: grid;
        gap: 10px;
      }
      .ml-cfg label {
        display: grid;
        gap: 4px;
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--mute);
      }
      .ml-cfg ol {
        color: var(--mute);
        font-size: 13px;
        line-height: 1.7;
        padding-left: 18px;
        margin: 0;
      }
      .ml-f {
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 10px 14px;
        border-top: 1px solid var(--bd);
        font-size: 12px;
        color: var(--mute);
      }
      .ml-f button {
        font-size: 11px;
        padding: 6px 10px;
      }
      .ml-st {
        display: block;
        color: var(--mute);
        font-size: 11px;
        margin: 4px 0;
      }
      .ml-pick {
        margin: 6px 0;
      }

      /* ===== v9: ordering & dividers ===== */
      .item {
        position: relative;
      }
      html.view :is(.dh, .dv-add, .dv-x, .lh .dv-new) {
        display: none !important;
      }
      .dh {
        width: 26px;
        height: 26px;
        padding: 0;
        display: grid;
        place-items: center;
        border: 0;
        background: rgba(0, 0, 0, 0.5);
        color: #fff;
        font-size: 13px;
        letter-spacing: -2px;
        cursor: grab;
        opacity: 0;
        transition:
          opacity 0.2s,
          background 0.2s;
        touch-action: none;
        user-select: none;
        z-index: 6;
      }
      .item > .dh {
        position: absolute;
        left: 8px;
        top: 8px;
      }
      .item:hover > .dh,
      .dv:hover > .dh,
      .dh:focus-visible {
        opacity: 1;
      }
      .dh:hover {
        background: var(--c-char);
        color: #fff;
      }
      .dh:active {
        cursor: grabbing;
      }
      @media (hover: none) {
        .dh {
          opacity: 0.85;
        }
        .dv-add {
          opacity: 0.45 !important;
        }
      }
      .lh .dv-new {
        margin-left: auto;
        font-size: 11px;
        padding: 5px 10px;
      }
      .dv-add {
        display: block;
        position: relative;
        width: 100%;
        max-width: 980px;
        height: 14px;
        margin: -14px auto 0;
        padding: 0;
        border: 0;
        background: none;
        opacity: 0;
        transition: opacity 0.2s;
        cursor: pointer;
      }
      .dv-add:before {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        top: 50%;
        border-top: 1px dashed var(--c-story);
      }
      .dv-add span {
        position: relative;

      /* ===== v10: timeline slideshow ===== */
      #tl.show .ev {
        transition:
          opacity 0.6s,

      #tl.show .ev:not(.cur) {
        opacity: 0.2;

      .ss-in {

        height: 2px;

        color: var(--ac);

      }

      }
      .ss-x {

          opacity: 0;

        flex: 1;
      }
      @media (prefers-reduced-motion: reduce) {
        .ev.cur .dot:after,
        .ss-sw * {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
